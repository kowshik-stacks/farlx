databases:
  - name: farlx-db
    databaseName: farlx_db
    user: farlx_db_user
    plan: free

services:
  - type: web
    name: farlx-backend
    runtime: node
    plan: free
    rootDir: farlx-backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farlx-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false

  - type: web
    name: farlx-web
    runtime: static
    rootDir: farlx-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://farlx-backend.onrender.com
