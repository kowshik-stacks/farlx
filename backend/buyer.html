<!DOCTYPE html>
<html>
<head>
  <title>FARLX Buyer Dashboard</title>
</head>

<body>
  <h1>FARLX Buyer Dashboard</h1>
  <p>Available farmer crop listings:</p>

  <button onclick="loadListings()">Refresh Listings</button>

  <br><br>

  <div id="listings">Click Refresh Listings to view listings.</div>

  <script>
    async function loadListings() {
      const response = await fetch("/api/listings");
      const data = await response.json();

      const listingsBox = document.getElementById("listings");

      if (data.totalListings === 0) {
        listingsBox.innerHTML = "<p>No crop listings available yet.</p>";
        return;
      }

      let html = "<table border='1' cellpadding='10'>";
      html += "<tr>";
      html += "<th>Crop</th>";
      html += "<th>Quantity</th>";
      html += "<th>Price/kg</th>";
      html += "<th>Location</th>";
      html += "<th>Farmer</th>";
      html += "<th>Action</th>";
      html += "</tr>";

      data.listings.forEach((listing) => {
        html += "<tr>";
        html += `<td>${listing.crop}</td>`;
        html += `<td>${listing.quantity} kg</td>`;
        html += `<td>₹${listing.price}</td>`;
        html += `<td>${listing.location}</td>`;
        html += `<td>${listing.farmerName}</td>`;
        html += `<td><button onclick="placeBid('${listing.id}')">Place Bid</button></td>`;
        html += "</tr>";
      });

      html += "</table>";

      listingsBox.innerHTML = html;
    }

   async function placeBid(listingId) {
  const price = prompt("Enter your offered price per kg:");

  if (price === null || price.trim() === "") {
    alert("Bid cancelled.");
    return;
  }

  const response = await fetch("/api/bids", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      listingId: listingId,
      price: price
    })
  });

  const data = await response.json();

  alert(data.message);
}
  </script>
</body>
</html>
